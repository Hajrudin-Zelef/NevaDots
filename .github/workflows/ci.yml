name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA épinglés (le commentaire # v4 est requis : Renovate suit le tag
      # pour proposer les mises à jour, voir helpers:pinGitHubActionDigests).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
