name: Android (TWA)

# Construit l'APK signé (et l'AAB pour le Play Store) de l'app NevaDots.
# L'app est une TWA : une coquille Android autour de https://nevadots.neva-ci.pro.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_BASE64   — `base64 -w0 nevadots.keystore`
#   ANDROID_KEYSTORE_PASSWORD — mot de passe du keystore
#   ANDROID_KEY_PASSWORD      — mot de passe de la clé (souvent identique)
#
# Sans le keystore, le build échoue volontairement : un APK signé avec une
# autre clé n'aurait pas la bonne empreinte dans assetlinks.json.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Restaurer le keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant — voir l'en-tête du workflow."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/android.keystore
          chmod 600 android/android.keystore

      - name: Construire l'APK et l'AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Vérifier les empreintes du keystore
        working-directory: android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android.keystore -alias nevadots \
            -storepass "$STORE_PASS" | grep -E 'SHA256|SHA1'

      - uses: actions/upload-artifact@v4
        with:
          name: nevadots-android
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30
